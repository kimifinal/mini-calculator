<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Glass Calculator Pro</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        :root {
            --bg-indigo: oklch(45% 0.15 260);
            --bg-purple: oklch(50% 0.18 300);
            --bg-teal: oklch(65% 0.12 180);
            --glass-bg: oklch(98% 0.01 260 / 0.12);
            --glass-border: oklch(100% 0 / 0 / 0.15);
            --text-main: oklch(98% 0.01 260);
            --accent-green: oklch(75% 0.15 145);
            --accent-orange: oklch(70% 0.2 45);
            --accent-red: oklch(60% 0.2 25);
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-sans);
            overflow: hidden;
            background: linear-gradient(135deg, var(--bg-indigo), var(--bg-purple), var(--bg-teal));
            background-size: 400% 400%;
            animation: bgGradient 15s ease infinite;
        }

        @keyframes bgGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .calculator-container { position: relative; z-index: 1; }

        .calculator {
            position: relative;
            z-index: 10;
            width: 320px;
            padding: 25px;
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(160%);
            -webkit-backdrop-filter: blur(30px) saturate(160%);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.4);
        }

        .glow {
            position: absolute;
            width: 250px;
            height: 250px;
            background: var(--bg-teal);
            filter: blur(100px);
            border-radius: 50%;
            z-index: 0;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.3;
        }

        .display {
            background: rgba(0, 0, 0, 0.25);
            color: var(--text-main);
            padding: 25px;
            text-align: right;
            font-size: 2.8rem;
            font-weight: 300;
            border-radius: 24px;
            margin-bottom: 25px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            box-shadow: inset 0 2px 15px rgba(0,0,0,0.2);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            aspect-ratio: 1;
            font-size: 1.3rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
        }

        button:active { transform: translateY(0) scale(0.95); }

        /* Target: (), %, +, -, *, / (Light Green) */
        button.operator, button.special-func {
            background: oklch(85% 0.12 150 / 0.2);
            color: oklch(85% 0.15 150);
            font-weight: 500;
        }

        button.operator:hover, button.special-func:hover {
            background: oklch(85% 0.15 150 / 0.4);
        }

        button.equals {
            background: var(--text-main);
            color: #000;
            font-weight: 700;
        }

        button.ac {
            background: oklch(60% 0.2 25 / 0.2);
            color: oklch(65% 0.2 25);
        }

        button.backspace {
            color: oklch(65% 0.2 25);
        }
    </style>
</head>
<body id="app">
<div class="calculator-container">
    <div class="glow"></div>
    <div class="calculator">
        <div class="display">{{ displayValue }}</div>
        <div class="buttons">
            <button class="ac" @click="reset">AC</button>
            <button class="special-func" @click="handleParentheses">()</button>
            <button class="special-func" @click="handlePercentage">%</button>
            <button class="operator" @click="handleOp('/')">÷</button>
            
            <button @click="handleNumber('7')">7</button>
            <button @click="handleNumber('8')">8</button>
            <button @click="handleNumber('9')">9</button>
            <button class="operator" @click="handleOp('*')">×</button>
            
            <button @click="handleNumber('4')">4</button>
            <button @click="handleNumber('5')">5</button>
            <button @click="handleNumber('6')">6</button>
            <button class="operator" @click="handleOp('-')">−</button>
            
            <button @click="handleNumber('1')">1</button>
            <button @click="handleNumber('2')">2</button>
            <button @click="handleNumber('3')">3</button>
            <button class="operator" @click="handleOp('+')">+</button>

            <button @click="handleNumber('0')">0</button>
            <button @click="handleDecimal()">.</button>
            <button class="backspace" @click="handleBackspace()">⌫</button>
            <button class="equals" @click="calculate">=</button>
        </div>
    </div>
</div>

<script>
const { createApp, ref } = Vue;

createApp({
    setup() {
        const displayValue = ref('0');
        const firstOperand = ref(null);
        const operator = ref(null);
        const waitingForSecondOperand = ref(false);

        const handleNumber = (num) => {
            if (displayValue.value === '0' || waitingForSecondOperand.value) {
                displayValue.value = num;
                waitingForSecondOperand.value = false;
            } else {
                displayValue.value += num;
            }
        };

        const handleDecimal = () => {
            if (!displayValue.value.includes('.')) {
                displayValue.value += '.';
            }
        };

        const handleBackspace = () => {
            if (displayValue.value.length > 1) {
                displayValue.value = displayValue.value.slice(0, -1);
            } else {
                displayValue.value = '0';
            }
        };

        const handlePercentage = () => {
            displayValue.value = (parseFloat(displayValue.value) / 100).toString();
        };

        const handleParentheses = () => { console.log("Parentheses clicked"); };

        const handleOp = (op) => {
            firstOperand.value = parseFloat(displayValue.value);
            operator.value = op;
            waitingForSecondOperand.value = true;
        };

        const calculate = () => {
            const secondOperand = parseFloat(displayValue.value);
            let result = 0;
            if (operator.value === null) return;

            switch (operator.value) {
                case '+': result = firstOperand.value + secondOperand; break;
                case '-': result = firstOperand.value - secondOperand; break;
                case '*': result = firstOperand.value * secondOperand; break;
                case '/': 
                    if (secondOperand === 0) {
                        displayValue.value = "Error";
                        return;
                    }
                    result = firstOperand.value / secondOperand; 
                    break;
            }
            displayValue.value = String(result);
            firstOperand.value = null;
            operator.value = null;
        };

        const reset = () => {
            displayValue.value = '0';
            firstOperand.value = null;
            operator.value = null;
        };

        return {
            displayValue, handleNumber, handleDecimal, handleBackspace,
            handlePercentage, handleParentheses, handleOp, calculate, reset
        };
    }
}).mount('#app');
</script>
</body>
</html>
