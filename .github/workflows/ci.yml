name: CI

on:
  push:
    branches: ['master', 'main', 'refactor/**', 'feature/**']
  pull_request:
    branches: ['master', 'main']

jobs:
  test:
    name: Lint + Unit + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      # C9 / #54: ESLint step — complements vue-tsc (style + static checks).
      # eslint already runs in `npm run lint` above, so this dedicated step is
      # a VISIBLE second gate; the job name `Lint + Unit + E2E` reflects it.
      - name: Lint (ESLint)
        run: npm run lint:eslint

      - name: Unit tests
        run: npm run test:unit

      # C7 → C9 / #54→#49: coverage v8 report + a real regression GATE.
      # C7 made it report-only; C9 adds thresholds to vite.config.ts
      # (statements/branches/functions/lines: 80/80/65/80 — all set below the
      # measured baseline, so the gate PASSES now but any >margin drop in any
      # category turns `test:coverage` RED). This is the "catch regressions"
      # half; the report is uploaded as an artifact for human inspection.
      - name: Coverage gate
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: End-to-end tests
        run: npm run test:e2e

  build:
    needs: test
    name: Build + Deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      GITHUB_PAGES: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages (only on master)
        if: github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master'
        id: deployment
        uses: actions/deploy-pages@v4
